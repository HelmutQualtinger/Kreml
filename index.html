<script>
const K = window.KREML;

// ---------- Grundgerüst ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c8e6);
scene.fog = new THREE.Fog(0xa9c8e6, 700, 2600);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1.5, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdfeaff, 0x8a8370, 0.78));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.85), SUN = new THREE.Vector3(260, 420, 300);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -330, right: 330, top: 330, bottom: -330, near: 50, far: 1300 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

// ---------- Materialien ----------
const L = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o));
const P = (c, s, sh) => new THREE.MeshPhongMaterial({ color: c, specular: s, shininess: sh });
const white = L(0xf4f1ea), dark = L(0x2b3038);
const roofGrey = L(0x8d9499), roofGreen = L(0x4f8a6b), tentGreen = L(0x3f7358), red = L(0xa9412f), brick = L(0xb5553c);
const gold = P(0xe2a91f, 0xfff1a8, 90), silver = P(0xb9bfc6, 0xffffff, 80), bronze = P(0x5b5a44, 0x9a936a, 30);
const flatMats = new Map();
function flatOf(mat) {                               // Lambert kennt in r128 kein flatShading
  if (!flatMats.has(mat)) flatMats.set(mat, mat.isMeshPhongMaterial ? Object.assign(mat.clone(), { flatShading: true }) : new THREE.MeshPhongMaterial({ color: mat.color, map: mat.map, flatShading: true, shininess: 4, specular: 0x0a0a0a }));
  return flatMats.get(mat);
}
const whiteFlat = flatOf(white), brickFlat = flatOf(brick);
const ruby = new THREE.MeshPhongMaterial({ color: 0xd3122a, emissive: 0x5a0008, specular: 0xffb0b0, shininess: 100 });

// ---------- Geometrie-Helfer (y = Unterkante) ----------
function box(p, w, h, d, x, y, z, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z); p.add(m); return m;
}
function cyl(p, rt, rb, h, x, y, z, mat, seg = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y + h / 2, z); p.add(m); return m;
}
function hip(p, w, d, h, x, y, z, mat) {           // Zeltdach über Rechteck
  const geo = new THREE.ConeGeometry(Math.SQRT1_2, h, 4); geo.rotateY(Math.PI / 4);
  const m = new THREE.Mesh(geo, flatOf(mat));
  m.scale.set(w, 1, d); m.position.set(x, y + h / 2, z); p.add(m); return m;
}
function cone(p, r, h, x, y, z, mat, seg = 8) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), seg <= 8 ? flatOf(mat) : mat);
  m.position.set(x, y + h / 2, z); p.add(m); return m;
}
const ONION = [[.86, 0], [1.08, .22], [1.2, .55], [1.1, .9], [.8, 1.25], [.42, 1.6], [.15, 1.92], [0, 2.15]];
function onion(p, r, x, y, z, mat, cross = true) {
  const m = new THREE.Mesh(new THREE.LatheGeometry(ONION.map(q => new THREE.Vector2(q[0] * r, q[1] * r)), 24), mat);
  m.position.set(x, y, z); p.add(m);
  if (!cross) return;
  const t = y + 2.1 * r, s = Math.max(r, 1.2);
  box(p, .09 * s, 1.1 * s, .09 * s, x, t, z, gold);
  box(p, .5 * s, .08 * s, .08 * s, x, t + .7 * s, z, gold);
  box(p, .3 * s, .07 * s, .07 * s, x, t + .9 * s, z, gold);
}
function domeTower(p, r, drumH, x, y, z, domeMat, drumMat = white) {
  const dr = r * .82;
  cyl(p, dr, dr, drumH, x, y, z, drumMat, 20);
  cyl(p, dr * 1.08, dr * 1.08, r * .18, x, y + drumH - r * .18, z, domeMat, 20);
  if (r > 1.4) for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4;
    box(p, dr * .22, drumH * .55, .3, x + Math.sin(a) * dr, y + drumH * .25, z + Math.cos(a) * dr, dark).rotation.y = a;
  }
  onion(p, r, x, y + drumH, z, domeMat);
}
function star(p, r, x, y, z) {
  const s = new THREE.Shape();
  for (let k = 0; k < 10; k++) { const a = k * Math.PI / 5 + Math.PI / 2, q = k % 2 ? r * .42 : r; s[k ? 'lineTo' : 'moveTo'](Math.cos(a) * q, Math.sin(a) * q); }
  const geo = new THREE.ExtrudeGeometry(s, { depth: .5, bevelEnabled: false }); geo.translate(0, 0, -.25);
  for (const ry of [0, Math.PI / 2]) { const m = new THREE.Mesh(geo, ruby); m.position.set(x, y + r, z); m.rotation.y = ry; p.add(m); }
  box(p, .25, 1.4, .25, x, y - 1.2, z, gold);
}
function winCanvas(wall) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 96;
  const g = c.getContext('2d');
  g.fillStyle = wall; g.fillRect(0, 0, 64, 96);
  g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(0, 0, 64, 6); g.fillRect(17, 20, 30, 56);
  g.fillStyle = '#2c3540'; g.beginPath(); g.moveTo(21, 72); g.lineTo(21, 36); g.arc(32, 36, 11, Math.PI, 0); g.lineTo(43, 72); g.fill();
  return c;
}
function texBox(p, w, h, d, x, y, z, wall, roofMat, cw = 4.5, floors = 2) {
  const mk = n => { const t = new THREE.CanvasTexture(winCanvas(wall)); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(Math.max(1, Math.round(n / cw)), floors); return new THREE.MeshLambertMaterial({ map: t }); };
  const a = mk(d), b = mk(w);
  return box(p, w, h, d, x, y, z, [a, a, roofMat, roofMat, b, b]);
}
// Wandmaterial für extrudierte Grundrisse (UV in Metern)
const wallCache = {};
function wallMat(col, cw = 4.4, fh = 4) {
  const k = col + cw + fh;
  if (!wallCache[k]) {
    const t = new THREE.CanvasTexture(winCanvas(col)); t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.flipY = false; t.repeat.set(1 / cw, 1 / fh); t.offset.y = -1 / fh; t.anisotropy = 4;
    wallCache[k] = new THREE.MeshLambertMaterial({ map: t });
  }
  return wallCache[k];
}
function patternMat(kind, c1, c2, rx = 2, ry = 1) {    // gemusterte Kuppeln
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.fillStyle = c1; g.fillRect(0, 0, 128, 128); g.fillStyle = c2; g.strokeStyle = c2;
  if (kind === 'spiral') for (let x = -128; x < 128; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 15, 0); g.lineTo(x + 143, 128); g.lineTo(x + 128, 128); g.fill(); }
  if (kind === 'ribs') for (let x = 0; x < 128; x += 32) g.fillRect(x, 0, 15, 128);
  if (kind === 'diamond') for (let x = 0; x < 128; x += 32) for (let y = 0; y < 128; y += 32) { g.beginPath(); g.moveTo(x + 16, y + 3); g.lineTo(x + 29, y + 16); g.lineTo(x + 16, y + 29); g.lineTo(x + 3, y + 16); g.fill(); }
  if (kind === 'zig') { g.lineWidth = 11; for (let y = 8; y < 128; y += 32) { g.beginPath(); for (let x = 0; x <= 128; x += 16) g.lineTo(x, y + (x / 16 % 2 ? 14 : 0)); g.stroke(); } }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  return new THREE.MeshPhongMaterial({ map: t, specular: 0x666666, shininess: 40 });
}

// ---------- Wegenetz (Raster für Pfadsuche) ----------
const G = 2, X0 = -470, Z0 = -640, NX = 505, NZ = 535;
const blocked = new Uint8Array(NX * NZ), reach = new Uint8Array(NX * NZ);
const cx = v => Math.max(0, Math.min(NX - 1, Math.floor((v - X0) / G)));
const cz = v => Math.max(0, Math.min(NZ - 1, Math.floor((v - Z0) / G)));
const wx = i => X0 + (i + .5) * G, wz = j => Z0 + (j + .5) * G;
const isBlocked = (x, z) => blocked[cz(z) * NX + cx(x)];
function pip(x, z, o) {
  let c = false;
  for (let i = 0, n = o.length, j = n - 2; i < n; j = i, i += 2) {
    const zi = o[i + 1], zj = o[j + 1];
    if ((zi > z) !== (zj > z) && x < (o[j] - o[i]) * (z - zi) / (zj - zi) + o[i]) c = !c;
  }
  return c;
}
function raster(p, val) {
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (let i = 0; i < p.o.length; i += 2) { x0 = Math.min(x0, p.o[i]); x1 = Math.max(x1, p.o[i]); z0 = Math.min(z0, p.o[i + 1]); z1 = Math.max(z1, p.o[i + 1]); }
  for (let j = cz(z0); j <= cz(z1); j++) for (let i = cx(x0); i <= cx(x1); i++) {
    const x = wx(i), z = wz(j);
    if (pip(x, z, p.o) && !(p.i || []).some(h => pip(x, z, h))) blocked[j * NX + i] = val;
  }
}

// ---------- Flächen und Körper aus Grundrissen ----------
function shapeOf(o, holes) {
  const mk = (s, r) => { for (let i = 0; i < r.length; i += 2) s[i ? 'lineTo' : 'moveTo'](r[i], -r[i + 1]); return s; };
  const s = mk(new THREE.Shape(), o);
  for (const h of holes || []) s.holes.push(mk(new THREE.Path(), h));
  return s;
}
function flatMesh(list, color, y) {
  if (!list.length) return;
  const geo = new THREE.ShapeGeometry(list.map(p => shapeOf(p.o, p.i))); geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, L(color)); m.position.y = y; m.receiveShadow = true; m.userData.flat = true; scene.add(m); return m;
}
const solids = [], infos = [];
function register(obj, info, x, z, ly) {
  if (!info) return;
  obj.userData.info = info;
  if (info.x === undefined) { info.x = x; info.z = z; info.ly = ly; infos.push(info); }
}
function extrude(b, h, wall, roofM, y0 = 0) {
  const geo = new THREE.ExtrudeGeometry(shapeOf(b.o, b.i), { depth: h, bevelEnabled: false }); geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, [roofM, wall]); m.position.y = y0; scene.add(m); solids.push(m); return m;
}
function slopedRoof(b, y, mat, s = 2.6) {             // umlaufende Dachschräge über dem Grundriss
  const geo = new THREE.ExtrudeGeometry(shapeOf(b.o, b.i), { depth: .02, bevelEnabled: true, bevelThickness: s * .75, bevelSize: s, bevelOffset: -s, bevelSegments: 1 });
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, mat); m.position.y = y; scene.add(m); solids.push(m); return m;
}
function frame(x, z, a, info, ly) {                  // lokales +x zeigt in Richtung a (Karte: x Ost, z Süd)
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = -a; scene.add(g); solids.push(g);
  register(g, info, x, z, ly); return g;
}

  }

// ---------- Pfadsuche (A*) ----------
function freeCell(i, j) {                             // nächste von der Figur erreichbare Zelle

    let best = -1, bd = 1e9;
    const chk = (x, y) => { if (x < 0 || y < 0 || x >= NX || y >= NZ) return; const n = y * NX + x; if (!reach[n]) return; const d = (x - i) * (x - i) + (y - j) * (y - j); if (d < bd) { bd = d; best = n; } };

}
function findPath(sx, sz, tx, tz) {

// ---------- Steuerung ----------
let speed = 11;

const infoEl = document.getElementById('info');

const list = document.getElementById('places');

let yaw = -.25, pitch = .5, dist = 150;

let moved = 0, pinch = 0;
const cv = renderer.domElement;

};

if (location.hash.startsWith('#cam=')) { const q = location.hash.slice(5).split(',').map(Number); if (q[5]) fig = figures[q[5]]; fig.g.position.set(q[0], 0, q[1]); camTarget.set(q[0], q[4] < 25 ? 2.3 : 4, q[1]); yaw = q[2]; pitch = q[3]; dist = q[4]; }
if (location.hash === '#map') {

// ---------- Schleife ----------

})();
